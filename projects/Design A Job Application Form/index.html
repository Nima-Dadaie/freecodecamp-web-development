<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="./Assets/styles.css">
</head>
<body>
    <div class="container">
        <h1>Job Application</h1>
        <form action="GET">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="position">Position:</label>
            <select name="position" id="position" required>
                <option value="" selected disabled>Choose</option>
                <option value="junior-developer">Junior Developer</option>
                <option value="mid-developer">Mid Developer</option>
                <option value="senior-developer">Senior Developer</option>
            </select>


            <fieldset class="radio-group">
                <legend>Availability</legend>

                <input type="radio" id="part-time" name="availability" checked>
                <label for="part-time">Part-Time</label>

                <input type="radio" id="full-time" name="availability">
                <label for="full-time">Full-Time</label>                
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea name="message" id="message" rows="4" cols="40" placeholder="Write down here" required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
