<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="./Assets/style.css">
</head>

<body>
    <ul class="todo-list">
        <h1>My To Do List</h1>
        <li>
            <input type="checkbox" id="learn-css" name="learn-css">
            <label for="learn-css">Study CSS on the freeCodeCamp website.</label>
            
            <ul class="sub-item">
                <li>
                    <a 
                    href="https://www.freecodecamp.org/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list" 
                    class="sub-item-link"
                    target="_blank">freecodecamp
                    </a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="learn-english" name="learn-english">
            <label for="learn-english">Study English with the Hamyar Zaban app.</label>

            <ul class="sub-item">
                <li>
                    <a 
                    href="https://hamyarzaban.com/" 
                    class="sub-item-link"
                    target="_blank">Hamyar Zaban
                    </a>
                </li>
            </ul>           
        </li>
        <li>
            <input type="checkbox" id="workout" name="workout">
            <label for="workout">Exercise according to the plan created by AI.</label>

            <ul class="sub-item">
                <li>
                    <a 
                    href="https://chatgpt.com/" 
                    class="sub-item-link"
                    target="_blank">OpenAI's GPT
                    </a>
                </li>
            </ul>           
        </li>
        <li>
            <input type="checkbox" id="nulls" name="nulls">
            <label for="nulls">Reach 11K trophies in Nulls Royale.</label>            
            <ul class="sub-item">
                <li>
                    <a 
                    href="https://nulls.gg/servers/nulls-royale/" 
                    class="sub-item-link"
                    target="_blank">Nulls Clash Royale
                    </a>
                </li>
            </ul>            
        </li>
    </ul>

</body>

</html>
